apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boxy-router
  namespace: boxy-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boxy-router
  namespace: boxy-sandboxes
subjects:
  - kind: ServiceAccount
    name: boxy-router
    namespace: boxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boxy-router
