apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boxy-operator
  namespace: {{ include "boxy.sandboxNamespace" . }}
rules:
  # Sandbox CRD
  - apiGroups: ["boxy.dev"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["boxy.dev"]
    resources: ["sandboxes/status"]
    verbs: ["get", "update", "patch"]
  # ControllerPool CRD
  - apiGroups: ["boxy.dev"]
    resources: ["controllerpools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["boxy.dev"]
    resources: ["controllerpools/status"]
    verbs: ["get", "update", "patch"]
  # Controller StatefulSet scaling
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  # Controller pod readiness
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boxy-operator
  namespace: {{ include "boxy.sandboxNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.operator.serviceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boxy-operator
