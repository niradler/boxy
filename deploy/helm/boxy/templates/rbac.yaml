apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boxy-router
  namespace: {{ include "boxy.sandboxNamespace" . }}
rules:
  - apiGroups: ["boxy.dev"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["boxy.dev"]
    resources: ["sandboxes/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boxy-router
  namespace: {{ include "boxy.sandboxNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.routerServiceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boxy-router
