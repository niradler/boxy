{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-tokens" (include "boxy.fullname" .)) }}
{{- $controllerToken := "" }}
{{- if and $existingSecret (index $existingSecret.data "controller-token") }}
{{- $controllerToken = index $existingSecret.data "controller-token" | b64dec }}
{{- else if .Values.controller.token }}
{{- $controllerToken = .Values.controller.token }}
{{- else }}
{{- $controllerToken = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boxy.fullname" . }}-tokens
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  controller-token: {{ $controllerToken | quote }}
  {{- if .Values.router.auth.staticToken }}
  router-token: {{ .Values.router.auth.staticToken | quote }}
  {{- end }}
