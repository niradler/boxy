apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boxy.fullname" . }}-router
  namespace: {{ .Release.Namespace }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.routerReplicas }}
  {{- end }}
  selector:
    matchLabels:
      app: boxy-router
  template:
    metadata:
      labels:
        app: boxy-router
    spec:
      serviceAccountName: {{ .Values.routerServiceAccount }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: {{ .Values.imageRouter }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BOXY_LISTEN_ADDR
              value: ":8080"
            - name: BOXY_ROUTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "boxy.fullname" . }}-tokens
                  key: router-token
            - name: BOXY_SANDBOX_NAMESPACE
              value: {{ include "boxy.sandboxNamespace" . | quote }}
            - name: BOXY_CONTROLLER_PORT
              value: {{ .Values.controllerPort | quote }}
            - name: BOXY_MTLS_DISABLED
              value: {{ .Values.mtlsDisabled | quote }}
            - name: BOXY_TLS_CA_PATH
              value: "/tls/ca.crt"
            - name: BOXY_TLS_CLIENT_CERT_PATH
              value: "/tls/tls.crt"
            - name: BOXY_TLS_CLIENT_KEY_PATH
              value: "/tls/tls.key"
            - name: BOXY_DEFAULT_SANDBOX_ENABLED
              value: {{ .Values.defaultSandbox.enabled | quote }}
            {{- if .Values.defaultSandbox.enabled }}
            - name: BOXY_DEFAULT_SANDBOX_CONFIG
              value: {{
                dict
                  "sessionId"       "default-box"
                  "sandboxId"       .Values.defaultSandbox.sandboxId
                  "owner"           .Values.defaultSandbox.owner
                  "ttlSeconds"      .Values.defaultSandbox.ttlSeconds
                  "env"             .Values.defaultSandbox.env
                  "allowedBinaries" .Values.defaultSandbox.allowedBinaries
                  "vm"              .Values.defaultSandbox.vm
                  "network"         .Values.defaultSandbox.network
                  "volumes"         .Values.defaultSandbox.volumes
                  "patches"         .Values.defaultSandbox.patches
                | toJson | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resourcesRouter | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if not .Values.mtlsDisabled }}
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if not .Values.mtlsDisabled }}
        - name: tls
          secret:
            secretName: {{ include "boxy.fullname" . }}-mtls-router
        {{- end }}
