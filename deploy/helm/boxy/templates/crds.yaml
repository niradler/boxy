{{- /*
  CRDs are placed in templates/ (not crds/) so that helm upgrade applies them on
  every release, keeping the schema in sync. The resource-policy annotation
  prevents helm uninstall from deleting the CRDs (and the CR data they protect).

  Upgrading from a release that had CRDs in crds/: Helm already applied those on
  first install, so these templates will match the existing resource names and
  Helm will update them in-place. No manual kubectl apply needed.
*/ -}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.boxy.dev
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: (devel)
spec:
  group: boxy.dev
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    singular: sandbox
    shortNames:
      - sbx
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: SandboxID
          type: string
          jsonPath: ".spec.sandboxId"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          description: Sandbox is a config template for creating sessions.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - sandboxId
              properties:
                sandboxId:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
                ttlSeconds:
                  type: integer
                  minimum: 0
                  maximum: 604800
                env:
                  type: object
                  additionalProperties:
                    type: string
                  x-kubernetes-validations:
                    - rule: "self.all(k, !k.startsWith('BOXY_') && !k.startsWith('KUBERNETES_'))"
                      message: "env keys starting with BOXY_ or KUBERNETES_ are reserved"
                allowedBinaries:
                  type: array
                  items:
                    type: string
                vm:
                  type: object
                  properties:
                    memoryMb:
                      type: integer
                      minimum: 64
                      maximum: 65536
                    vcpus:
                      type: integer
                      minimum: 1
                      maximum: 64
                    workdir:
                      type: string
                    shell:
                      type: string
                    hostname:
                      type: string
                    user:
                      type: string
                    maxDurationSec:
                      type: integer
                      minimum: 0
                    idleTimeoutSec:
                      type: integer
                      minimum: 0
                    rlimits:
                      type: array
                      items:
                        type: object
                        required: [resource, soft, hard]
                        properties:
                          resource:
                            type: string
                          soft:
                            type: integer
                            format: int64
                          hard:
                            type: integer
                            format: int64
                    scripts:
                      type: array
                      items:
                        type: object
                        required: [name, content]
                        properties:
                          name:
                            type: string
                          content:
                            type: string
                    seccompString:
                      type: string
                    cloneNewTime:
                      type: boolean
                network:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    allowInternetAccess:
                      type: boolean
                    rules:
                      type: array
                      items:
                        type: object
                        properties:
                          direction:
                            type: string
                            enum: [ingress, egress]
                          action:
                            type: string
                            enum: [allow, deny]
                          protocols:
                            type: array
                            items:
                              type: string
                          ports:
                            type: array
                            items:
                              type: integer
                          portRanges:
                            type: array
                            items:
                              type: object
                              properties:
                                start:
                                  type: integer
                                end:
                                  type: integer
                          domains:
                            type: array
                            items:
                              type: string
                          domainSuffixes:
                            type: array
                            items:
                              type: string
                          cidrs:
                            type: array
                            items:
                              type: string
                          groups:
                            type: array
                            items:
                              type: string
                    ports:
                      type: array
                      items:
                        type: object
                        properties:
                          hostPort:
                            type: integer
                          guestPort:
                            type: integer
                          protocol:
                            type: string
                    dns:
                      type: object
                      properties:
                        nameservers:
                          type: array
                          items:
                            type: string
                        rebindProtection:
                          type: boolean
                        queryTimeoutMs:
                          type: integer
                    secrets:
                      type: array
                      items:
                        type: object
                        required: [envVar, value]
                        properties:
                          envVar:
                            type: string
                          value:
                            type: string
                          allowedHosts:
                            type: array
                            items:
                              type: string
                          allowedHostPatterns:
                            type: array
                            items:
                              type: string
                          allowAnyHostDangerous:
                            type: boolean
                    maxConnections:
                      type: integer
                    trustHostCAs:
                      type: boolean
                    macvlan:
                      type: object
                      properties:
                        interface:
                          type: string
                        ip:
                          type: string
                        netmask:
                          type: string
                        gateway:
                          type: string
                        mac:
                          type: string
                    usePasta:
                      type: boolean
                volumes:
                  type: array
                  items:
                    type: object
                    required: [guestPath, type]
                    properties:
                      guestPath:
                        type: string
                      type:
                        type: string
                      hostPath:
                        type: string
                      name:
                        type: string
                      sizeMb:
                        type: integer
                      readonly:
                        type: boolean
                patches:
                  type: array
                  items:
                    type: object
                    required: [type, path]
                    properties:
                      type:
                        type: string
                      path:
                        type: string
                      content:
                        type: string
                      bytes:
                        type: string
                      hostPath:
                        type: string
                      target:
                        type: string
                      mode:
                        type: integer
                      replace:
                        type: boolean
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sessions.boxy.dev
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: (devel)
spec:
  group: boxy.dev
  names:
    kind: Session
    listKind: SessionList
    plural: sessions
    singular: session
    shortNames:
      - sess
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: ".status.phase"
        - name: SandboxID
          type: string
          jsonPath: ".spec.sandboxId"
        - name: Controller
          type: string
          jsonPath: ".status.controllerPod"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          description: Session is a running sandbox instance managed by the boxy operator.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - sessionId
                - sandboxId
              properties:
                sessionId:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
                sandboxId:
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
                owner:
                  type: string
                  maxLength: 63
                  pattern: '^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$'
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Creating
                    - Running
                    - Deleting
                    - Terminated
                controllerPool:
                  type: string
                controllerPod:
                  type: string
                controllerAddress:
                  type: string
                port:
                  type: integer
                  format: int32
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
                terminatedAt:
                  type: string
                  format: date-time
                lastExecAt:
                  type: string
                  format: date-time
                message:
                  type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: controllerpools.boxy.dev
  annotations:
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: (devel)
spec:
  group: boxy.dev
  names:
    kind: ControllerPool
    listKind: ControllerPoolList
    plural: controllerpools
    singular: controllerpool
    shortNames:
      - cp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: integer
          jsonPath: ".status.readyReplicas"
        - name: Active
          type: integer
          jsonPath: ".status.activeSandboxCount"
        - name: Age
          type: date
          jsonPath: ".metadata.creationTimestamp"
      schema:
        openAPIV3Schema:
          type: object
          description: ControllerPool represents the fleet of boxy-controller pods (a single StatefulSet).
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - maxSandboxes
                - maxReplicas
                - minReplicas
              properties:
                maxSandboxes:
                  type: integer
                  minimum: 1
                maxReplicas:
                  type: integer
                  format: int32
                  minimum: 1
                minReplicas:
                  type: integer
                  format: int32
                  minimum: 1
                image:
                  type: string
                preinstalledBinaries:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                  format: int32
                activeSandboxCount:
                  type: integer
                  format: int32
                lastScaleTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
