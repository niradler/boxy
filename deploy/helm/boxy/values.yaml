imageRouter: boxy-router:e2e
imagePullPolicy: IfNotPresent

sandboxNamespace: ""

routerReplicas: 1
routerServicePort: 8080

# --- Router autoscaling (HPA) ---
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

routerToken: "changeme-router"

resourcesRouter:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

routerServiceAccount: boxy-router

# --- nsjail controller (StatefulSet) ---
controllerImage: boxy-controller:e2e
controllerPort: 8080
controllerReplicas: 1
maxSandboxesPerController: 20
controllerServiceAccount: boxy-controller

resourcesController:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

# mTLS between router and controller. Set mtlsDisabled: true for local dev.
mtlsDisabled: false
mtlsCACN: "boxy-ca"
mtlsServerCN: "boxy-controller"
mtlsClientCN: "boxy-router"

# K8s NetworkPolicy applied to controller pods (default-deny egress).
# Per-sandbox network isolation is enforced by nsjail network namespaces.
enableSandboxNetworkPolicy: true

# Controller log level (RUST_LOG).
logLevel: "warn"               # off | error | warn | info | debug | trace

# nsjail config (env vars on the controller pod).
nsjailPath: "/usr/sbin/nsjail"
nsjailRootfs: "/rootfs/ubuntu-24.04"
nsjailBinariesDir: "/usr/local/bin"

# --- Default sandbox (for MCP clients that don't specify X-Sandbox-Id) ---
defaultSandbox:
  enabled: false
  sandboxId: "default"
  owner: "system"
  ttlSeconds: 86400
  env: {}
  allowedBinaries: ["curl", "python3"]
  vm:
    memoryMb: 512
    vcpus: 1
    workdir: "/workspace"
    shell: "/bin/bash"
    idleTimeoutSec: 0
  network:
    allowInternetAccess: false
    allowedEgressDomains: []
  volumes: []

# The controller pod requires CAP_SYS_ADMIN for overlayfs per-sandbox filesystem
# isolation. No hardware dependency — overlayfs is a standard kernel feature
# available on all Linux systems. Set in the pod securityContext (see template).

# --- Sandbox Operator ---
imageOperator: boxy-operator:e2e
operatorServiceAccount: boxy-operator
terminatedRetentionSeconds: 3600
maxControllerReplicas: 50
minControllerReplicas: 1
