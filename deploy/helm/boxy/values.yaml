imageRouter: boxydev/boxy-router:dev
imageWorker: boxydev/boxy-worker:dev
imagePullPolicy: IfNotPresent

sandboxNamespace: ""

routerReplicas: 2
routerServicePort: 8080
workerPort: 8080

routerToken: "changeme-router"
workerToken: "changeme-worker"

resourcesRouter:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

workerResources:
  cpu: "500m"
  memory: "1Gi"

reaperIntervalSeconds: 30

workerServiceAccount: boxy-worker
routerServiceAccount: boxy-router
