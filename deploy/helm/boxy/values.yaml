imageRouter: boxy-router:e2e
imagePullPolicy: IfNotPresent

sandboxNamespace: ""

routerReplicas: 1
routerServicePort: 8080

# --- Router autoscaling (HPA) ---
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

routerToken: "changeme-router"

resourcesRouter:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

routerServiceAccount: boxy-router

# --- Microsandbox controller (StatefulSet) ---
controllerImage: boxy-controller:e2e
controllerPort: 8080
controllerReplicas: 1
maxSandboxesPerController: 20
controllerServiceAccount: boxy-controller

resourcesController:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

# mTLS between router and controller. Set mtlsDisabled: true for local dev.
mtlsDisabled: false
mtlsCACN: "boxy-ca"
mtlsServerCN: "boxy-controller"
mtlsClientCN: "boxy-router"

# K8s NetworkPolicy applied to controller pods (default-deny egress).
# Fine-grained per-sandbox network policy is enforced inside the VM by microsandbox.
enableSandboxNetworkPolicy: true

# VM operator defaults (env vars on the controller pod).
vmLogLevel: "warn"             # off | error | warn | info | debug | trace
vmMetricsIntervalMs: 0         # 0 = disabled
vmPullPolicy: "if_missing"     # if_missing | always | never
libkrunfwPath: ""              # empty = microsandbox default

# --- Default sandbox (for MCP clients that don't specify X-Sandbox-Id) ---
defaultSandbox:
  enabled: false
  sandboxId: "default"
  owner: "system"
  ttlSeconds: 86400
  env: {}
  allowedBinaries: ["curl", "python3"]
  vm:
    memoryMb: 512
    vcpus: 1
    workdir: "/workspace"
    shell: "/bin/bash"
    idleTimeoutSec: 0
  network:
    allowInternetAccess: false
    allowedEgressDomains: []
  volumes: []
  patches: []

# ---------------------------------------------------------------------------
# KVM access mode (required — microsandbox has no no-KVM fallback)
#
# microsandbox requires hardware-assisted virtualization on every node that
# runs a controller pod. Supported platforms:
#   - Linux with KVM enabled (/dev/kvm)
#   - macOS Apple Silicon: Docker Desktop exposes /dev/kvm inside containers
#
# kvmMode controls HOW the controller pod gets /dev/kvm — not whether it needs it.
#
#   device   — (default, production) Request "devices.kubevirt.io/kvm: 1"
#              resource limit. Requires KubeVirt or a KVM device plugin on
#              cluster nodes. Least-privileged option.
#
#   hostpath — Mount /dev/kvm via hostPath + run privileged. Use for kind
#              clusters or bare-metal nodes without a KVM device plugin.
#              Requires the namespace to allow privileged pods (PSA: privileged).
#              local/kind-e2e.sh sets this automatically when /dev/kvm is
#              detected inside the kind node.
# ---------------------------------------------------------------------------
kvmMode: "device"

# --- Sandbox Operator ---
imageOperator: boxy-operator:e2e
operatorServiceAccount: boxy-operator
terminatedRetentionSeconds: 3600
maxControllerReplicas: 50
minControllerReplicas: 1
